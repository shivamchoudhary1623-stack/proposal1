<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .gif-container img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
        }
        h1 {
            color: #d81b60;
            font-size: 24px;
            margin: 20px 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
        }
        #yesBtn:hover {
            background-color: #c2185b;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container" id="gifContainer">
            <!-- Cute initial GIF -->
            <img id="mainGif" src="https://media.giphy.com/media/T1WqKkLY753dZghbu6/giphy.gif" alt="Cute Cat">
        </div>
        <h1 id="questionText">Do you love me? 🥺</h1>
        <div class="btn-container" id="btnContainer">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        const messages = [
            "Please think again! 🥺",
            "Ek aur baar Soch lo! 🤔",
            "Beautiful pls Man jao na! Kitna code likh waogi 😭",
            "Soch lo acche se! 💭",
            "Man jao na yaar! ❤️"
        ];
        
        let messageIndex = 0;

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const questionText = document.getElementById('questionText');
            const mainGif = document.getElementById('mainGif');

            // Change text and gif on trying to click No
            if (messageIndex < messages.length) {
                questionText.innerText = messages[messageIndex];
                messageIndex++;
            } else {
                messageIndex = 0; // loop messages if needed
                questionText.innerText = messages[messageIndex];
            }

            // Random movement inside screen bounds
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function sayYes() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cats">
                </div>
                <h1>I knew it! You Love me a lot 🥰</h1>
            `;
        }
    </script>
</body>
</html>
