<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Do You Love Me?</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            width: 100vw;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 85%;
            position: relative;
        }
        .gif-container img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }
        h1 {
            color: #d81b60;
            font-size: 22px;
            margin: 20px 0;
            min-height: 60px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
            position: relative;
            z-index: 1;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: absolute;
            right: 20px;
            z-index: 999;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container" id="gifContainer">
            <img id="mainGif" src="https://media.giphy.com/media/T1WqKkLY753dZghbu6/giphy.gif" alt="Cute Cat">
        </div>
        <h1 id="questionText">Do you love me? 🥺</h1>
        <div class="btn-container" id="btnContainer">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const messages = [
            "Please think again! 🥺",
            "Ek aur baar Soch lo! 🤔",
            "Beautiful pls Man jao na! 😭",
            "Soch lo acche se! 💭",
            "Man jao na yaar! ❤️"
        ];
        
        let messageIndex = 0;
        const noBtn = document.getElementById('noBtn');

        function moveNoButton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const questionText = document.getElementById('questionText');

            if (messageIndex < messages.length) {
                questionText.innerText = messages[messageIndex];
                messageIndex++;
            } else {
                messageIndex = 0;
                questionText.innerText = messages[messageIndex];
            }

            const padding = 30;
            const btnWidth = noBtn.offsetWidth || 80;
            const btnHeight = noBtn.offsetHeight || 40;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Mobile touch control
        noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
        noBtn.addEventListener('pointerdown', moveNoButton);
        noBtn.addEventListener('mouseover', moveNoButton);

        function sayYes() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cats">
                </div>
                <h1>I knew it! You Love me a lot 🥰</h1>
            `;
        }
    </script>
</body>
</html>
