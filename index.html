<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 85%;
        }
        .gif-container img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }
        h1 {
            color: #d81b60;
            font-size: 20px;
            margin: 20px 0;
            min-height: 60px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/T1WqKkLY753dZghbu6/giphy.gif" alt="Cute Gif">
        </div>
        <h1 id="questionText">Do you love me? 🥺</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="handleNoClick()">No</button>
        </div>
    </div>

    <script>
        // Har No click par alag Question aur Gif aayega
        const steps = [
            {
                text: "Please think again! 🥺",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eDh6b2szcnJ3NW1icmtxbmY1OWM1eHZydjE3OHc0dmVsaG5iZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L95W4wv8nnb9K/giphy.gif"
            },
            {
                text: "Ek aur baar Soch lo! 🤔",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHlsOHgyZHFzZHJvd2NvaDFrcW1icWoxdzM2eGdyNnE0ZGlvdnR2dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OPU6wzx8WrH4A/giphy.gif"
            },
            {
                text: "beautiful pls Man jao na! 😭",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F3OGUzdjN1OTN3OWs2Mmp0aWp3OWFkcnpmbmdwOWpwbzEzN29vZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22UJ44aTOQF2/giphy.gif"
            },
            {
                text: "Aisa mat karo, maan jao na! 💔",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndicm91azQ5a2ZmMmdzcGpxeWhlZXZ0eWlnd3Axdmx1aXUza3hwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7sfMAp3p2IAtE51K2a/giphy.gif"
            },
            {
                text: "Maan jao na yaar, kitna bhaav khaogi! ❤️",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmtpZDFiMzhidnlodDF6M3AycXkzd2M4Y2FvemtuZ2pucTZzMnpqbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c6DIpP4mFpbmdE8l50/giphy.gif"
            }
        ];

        let stepIndex = 0;
        let yesSize = 16; // Initial Yes button text size

        function handleNoClick() {
            const questionText = document.getElementById('questionText');
            const mainGif = document.getElementById('mainGif');
            const yesBtn = document.getElementById('yesBtn');

            if (stepIndex < steps.length) {
                questionText.innerText = steps[stepIndex].text;
                mainGif.src = steps[stepIndex].gif;
                stepIndex++;
            } else {
                stepIndex = 0;
                questionText.innerText = steps[stepIndex].text;
                mainGif.src = steps[stepIndex].gif;
            }

            // Har No click par Yes button bada hota jayega
            yesSize += 6;
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (10 + yesSize/3) + 'px ' + (20 + yesSize/2) + 'px';
        }

        function sayYes() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cats">
                </div>
                <h1>I knew it! You Love me a lot 🥰</h1>
            `;
        }
    </script>
</body>
</html>
