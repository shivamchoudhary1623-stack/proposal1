<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <!-- Google Font for Cute Style -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating Background Hearts Animation */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .heart {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            transform: rotate(45deg);
            animation: floatUp 6s infinite linear;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: -50%; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(45deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(45deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Main Card Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 360px;
            width: 85%;
            z-index: 10;
            border: 3px solid #ff477e;
        }
        .gif-container img {
            width: 140px;
            height: 140px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d81b60;
            font-size: 19px;
            margin: 20px 0;
            min-height: 70px;
            font-weight: 700;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: 'Poppins', sans-serif;
        }
        #yesBtn {
            background: linear-gradient(135deg, #ff477e 0%, #ff7096 100%);
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Background Floating Hearts -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="container">
        <div class="gif-container">
            <img id="mainGif" src="https://media.giphy.com/media/T1WqKkLY753dZghbu6/giphy.gif" alt="Cute Gif">
        </div>
        <h1 id="questionText">Prachi, Do you love me? 🥺</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="handleNoClick()">No</button>
        </div>
    </div>

    <script>
        // Automatic floating hearts generator
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            const size = Math.random() * 15 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            
            container.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);

        // Alag-alag unique questions aur better GIFs (Prachi & Ginni ek hi naam)
        const steps = [
            {
                text: "Sach batao Prachi, thoda sa bhi pyaar nahi hai kya? 🥺",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eDh6b2szcnJ3NW1icmtxbmY1OWM1eHZydjE3OHc0dmVsaG5iZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L95W4wv8nnb9K/giphy.gif"
            },
            {
                text: "Aise na karo Ginni, dil mat dukhaao mera! 💔",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndicm91azQ5a2ZmMmdzcGpxeWhlZXZ0eWlnd3Axdmx1aXUza3hwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7sfMAp3p2IAtE51K2a/giphy.gif"
            },
            {
                text: "Prachi ji, maan bhi jao na ab kitna bhav khaogi? 😂",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F3OGUzdjN1OTN3OWs2Mmp0aWp3OWFkcnpmbmdwOWpwbzEzN29vZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d22UJ44aTOQF2/giphy.gif"
            },
            {
                text: "Ginni maan jao warna main ro dunga! 😭",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYWZ0OWV4ZWV3dGV2OGxmdGJmbm5qcm84Z2RtdnkyZTRicnZ6cHR5MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oKIPnAiaMCws8nOsE/giphy.gif"
            },
            {
                text: "Man jao na Prachi, tum meri favorite ho! ❤️",
                gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmtpZDFiMzhidnlodDF6M3AycXkzd2M4Y2FvemtuZ2pucTZzMnpqbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/c6DIpP4mFpbmdE8l50/giphy.gif"
            }
        ];

        let stepIndex = 0;
        let yesSize = 16;

        function handleNoClick() {
            const questionText = document.getElementById('questionText');
            const mainGif = document.getElementById('mainGif');
            const yesBtn = document.getElementById('yesBtn');

            if (stepIndex < steps.length) {
                questionText.innerText = steps[stepIndex].text;
                mainGif.src = steps[stepIndex].gif;
                stepIndex++;
            } else {
                stepIndex = 0;
                questionText.innerText = steps[stepIndex].text;
                mainGif.src = steps[stepIndex].gif;
            }

            // Yes button size badhega
            yesSize += 5;
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (10 + yesSize/3) + 'px ' + (20 + yesSize/2) + 'px';
        }

        function sayYes() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div class="gif-container">
                    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cats">
                </div>
                <h1 style="color: #ff477e;">Yay! I knew you love me Prachi (Ginni) - Love you too! 🥰❤️</h1>
            `;
        }
    </script>
</body>
</html>
